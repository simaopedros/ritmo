<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ritmo — Legal</title>
  <meta name="description" content="Política de Privacidade e Termos de Uso do aplicativo Ritmo." />
  <style>
    :root {
      --bg: #0B0B0F;
      --fg: #F4F4F8;
      --muted: #A0A0B0;
      --accent: #7C5CFF;
      --card: #16161E;
      --border: #2A2A36;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--fg);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      align-items: center;
    }
    main {
      max-width: 480px;
      margin: 0 auto;
      padding: 2.5rem 1.25rem;
      width: 100%;
    }
    h1 { font-size: 1.75rem; margin: 0 0 0.25rem; letter-spacing: -0.02em; }
    .meta { color: var(--muted); font-size: 0.9rem; margin-bottom: 1.5rem; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem 1.15rem;
      margin: 0.75rem 0;
    }
    a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
      display: block;
      padding: 0.35rem 0;
    }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main>
    <h1>Ritmo</h1>
    <p class="meta">Documentos legais · com.ritmo.app</p>
    <div class="card">
      <a href="./privacy.html">Política de Privacidade</a>
      <a href="./terms.html">Termos de Uso</a>
    </div>
  </main>
</body>
</html>
